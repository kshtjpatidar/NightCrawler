# NightCrawler v5.0 - Bug Bounty Reconnaissance Configuration
# Scope-aware, rate-limited recon for authorized bug bounty targets

scope:
  enabled: true
  allowed_domains:
    - uxcam.com
    - "*.uxcam.com"
    - uxc.am
    - "*.uxc.am"

  excluded_domains:
    - tara.uxcam.com
    - "*.tara.uxcam.com"
    - connect.uxcam.com
    - "*.connect.uxcam.com"

researcher:
  custom_header_enabled: true
  header_name: X-User-Id
  header_value_env: NIGHTCRAWLER_RESEARCHER_ID

scan:
  concurrency: 1
  timeout: 30
  depth: 1
  max_requests_per_second: 5
  strict_scope: true
  verify_tls: true

features:
  javascript_extraction: true
  endpoint_discovery: true
  secret_detection: true
  validate_keys: false
  external_secret_validation: false

report:
  default_template: bugcrowd
  default_format: html
